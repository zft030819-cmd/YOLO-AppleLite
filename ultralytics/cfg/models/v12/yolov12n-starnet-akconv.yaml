# Model B: YOLOv12n-StarNet-AKConv (Final Flawless Version)
# 架构描述：轻量化主干 (StarNet) 结合针对微小病斑的动态感受野模块 (AKConv)

nc: 9 # 苹果叶片病害类别总数
scales:
  n: [0.50, 0.25, 1024] # Nano 版缩放因子 (Depth: 0.50, Width: 0.25)

# --- Backbone (严格对齐输入输出维度) ---
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1: 输出 16
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2: 输出 32
  - [-1, 2, StarBlock, [128]]      # 2: 输入 32，输出 32 (完美匹配深度卷积)
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3: 输出 64
  - [-1, 3, StarBlock, [256]]      # 4: 输入 64，输出 64 (完美匹配)
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4: 输出 128
  - [-1, 3, StarBlock, [512]]      # 6: 输入 128，输出 128 (完美匹配)
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5: 输出 256
  - [-1, 2, StarBlock, [1024]]     # 8: 输入 256，输出 256 (完美匹配)
  - [-1, 1, SPPF, [1024, 5]]       # 9: 输出 256

# --- Neck & Head (特征融合与变形检测头) ---
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11: 融合 P4
  - [-1, 1, A2C2f, [512, False]]               # 12: 输出 128 (满足 32 倍数)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]                  # 14: 融合 P3 (小目标特征图)

  # --- 引入 AKConv 算子 ---
  # 第 15 层：输入 192 (128+64)，输出 192 (基准通道 768 * 0.25 = 192)。保持张量大小，仅改变感受野！
  - [-1, 1, AKConv, [768]]

  - [-1, 1, A2C2f, [256, False]]               # 16: P3 最终语义图 (输出 64，满足 32 倍数)
  - [-1, 1, Conv, [256, 3, 2]]                 # 17
  - [[-1, 12], 1, Concat, [1]]                 # 18: 严格指向层级 12 的 A2C2f
  - [-1, 1, A2C2f, [512, False]]               # 19: P4 最终语义图 (输出 128，满足 32 倍数)
  - [-1, 1, Conv, [512, 3, 2]]                 # 20
  - [[-1, 9], 1, Concat, [1]]                  # 21: 严格指向层级 9 的 SPPF
  - [-1, 1, C3k2, [1024, True]]                # 22: P5 最终语义图

  # --- Detect Head ---
  - [[16, 19, 22], 1, Detect, [nc]]            # 23