# YOLOv12 🚀, AGPL-3.0 license
# YOLOv12 object detection model with P3-P5 outputs.
# Model A: Constrained StarNet (Strict Channel Scaling, No AKConv)

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # 严格执行 0.25 的宽度缩放
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLOv12n-StarNet Backbone (轻量化主干，通道严格受限)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, StarBlock, [128]]   # 2-P2/4 (最终缩放为 32)
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, StarBlock, [256]]   # 4-P3/8 (最终缩放为 64)
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, StarBlock, [512]]   # 6-P4/16 (最终缩放为 128)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, StarBlock, [1024]]  # 8-P5/32 (最终缩放为 256)
  - [-1, 1, SPPF, [1024, 5]]    # 9

# YOLOv12-turbo Head (修正了所有路由索引 Bug)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11: cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 12: 输出 128 通道

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14: cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 15: 小目标特征提取层 (输出 64 通道)

  - [-1, 1, Conv, [256, 3, 2]] # 16: 下采样
  - [[-1, 12], 1, Concat, [1]] # 17: 【Bug修复点】精准链接第12层的 A2C2f
  - [-1, 2, A2C2f, [512, False, -1]] # 18: 中目标特征提取层 (输出 128 通道)

  - [-1, 1, Conv, [512, 3, 2]] # 19: 下采样
  - [[-1, 8], 1, Concat, [1]] # 20: cat head P5
  - [-1, 2, C3k2, [1024, True]] # 21: 大目标特征提取层 (输出 256 通道)

  - [[15, 18, 21], 1, Detect, [nc]] # 22: 【Bug修复点】使用 15, 18, 21 层特征输出