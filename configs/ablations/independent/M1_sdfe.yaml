# A2_sdfe: + SDFE-Block（P3与P4）
# Architecture ablation only. CIoU + DFL + BCE; NWD OFF.
# nn.Identity preserves indices and has no parameters/feature transformation.
nc: 8
scale: n
scales:
  n: [0.5, 0.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]  # 1
  - [-1, 2, C3k2, [256, false, 0.25]]  # 2
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]  # 3
  - [-1, 2, C3k2, [256, false, 0.25]]  # 4
  - [-1, 1, SDFE_Block, [256, 3]]  # 5
  - [-1, 1, Conv, [384, 3, 2]]  # 6
  - [-1, 1, SDFE_Block, [384, 2]]  # 7
  - [-1, 1, Conv, [512, 3, 2]]  # 8
  - [-1, 2, A2C2f, [512, true, 1]]  # 9

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]  # 10
  - [[-1, 7], 1, Concat, [1]]  # 11
  - [-1, 1, Conv, [384, 1, 1]]  # 12
  - [-1, 2, C3k2, [384, false, 0.25]]  # 13
  - [-1, 1, nn.Upsample, [null, 2, nearest]]  # 14
  - [[-1, 5], 1, Concat, [1]]  # 15
  - [-1, 1, Conv, [256, 1, 1]]  # 16
  - [-1, 2, C3k2, [256, false, 0.5]]  # 17
  - [-1, 1, nn.Identity, []]  # 18
  - [-1, 1, Conv, [384, 3, 2]]  # 19
  - [[-1, 13], 1, Concat, [1]]  # 20
  - [-1, 1, Conv, [384, 1, 1]]  # 21
  - [-1, 2, C3k2, [384, false, 0.25]]  # 22
  - [-1, 1, Conv, [512, 3, 2]]  # 23
  - [[-1, 9], 1, Concat, [1]]  # 24
  - [-1, 1, Conv, [512, 1, 1]]  # 25
  - [-1, 2, C3k2, [512, false, 0.25]]  # 26
  - [[18, 22, 26], 1, Detect, [nc]]  # 27
